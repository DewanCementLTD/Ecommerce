##
## Storeforge — Nginx front end (Phase 3, Task 5).
##
## One server block serves every client store. That is the whole point of the
## platform: a new client is a `domains` row, and nothing here changes. The
## `server_name` list below exists only so TLS can be terminated for each
## hostname; the *application* never reads it from this file — it reads the
## Host header, which is why `proxy_set_header Host` must be exact.
##
## Install:
##   /etc/nginx/sites-available/storeforge.conf  (symlink into sites-enabled)
##   nginx -t && systemctl reload nginx
##
## TLS is issued by certbot, which rewrites the listen/ssl_certificate lines
## into a copy of this file. Keep this one as the source of truth and re-run
## certbot after editing — see docs/runbooks/add-domain.md.
##

upstream storeforge_api {
    server 127.0.0.1:8003;
    keepalive 32;
}

upstream storeforge_storefront {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Brotli where the module is available, gzip always. Both are needed: brotli
# compresses SSR HTML materially better, and gzip is the fallback for clients
# and proxies that do not offer `br`.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml application/xml application/xml+rss
    application/json application/javascript text/javascript
    image/svg+xml application/manifest+json;

# Images and fonts are already compressed; running them through gzip spends CPU
# to make them very slightly larger.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # certbot's ACME challenge has to stay reachable over plain HTTP, or
    # renewal fails silently and a domain goes dark 90 days later.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # certbot manages these lines. One certificate per client domain; this
    # block is duplicated per domain by `certbot --nginx`, or replaced with a
    # wildcard if the platform ever moves to subdomains of one apex.
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/PLATFORM_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PLATFORM_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The apps set their own security headers (helmet on the API, next.config
    # on the storefront) so they stay correct when run without Nginx in front.
    # HSTS is repeated here because it is the one header that must be present
    # even on a response Nginx generates itself, such as a 502.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # A product with images and a description is a few hundred KB; an upload is
    # capped at 10MB by multer. 12M leaves room for the multipart envelope and
    # refuses anything larger before Node ever sees it.
    client_max_body_size 12M;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    # Real client IP through to the app: every rate limit in the API is keyed
    # by it, and without these headers every request appears to come from
    # 127.0.0.1 and one visitor can lock out everyone.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # --- Media -------------------------------------------------------------
    # Served by the API (it resolves the tenant from the Host header and reads
    # from disk), cached hard at the edge. The URL carries a media id and an
    # explicit width, and re-uploading creates a new id rather than replacing
    # bytes, so these really are immutable.
    #
    # `proxy_cache_key` includes $http_accept because the API content-negotiates
    # AVIF against WebP on the same URL — without it, one visitor's AVIF would
    # be served to a browser that cannot decode it.
    location /storefront/media/ {
        proxy_pass http://storeforge_api;
        proxy_cache storeforge_media;
        proxy_cache_key "$scheme$host$request_uri$http_accept";
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Next.js build assets ---------------------------------------------
    # Content-hashed filenames: safe to cache forever, and never worth asking
    # the origin about.
    location /_next/static/ {
        proxy_pass http://storeforge_storefront;
        proxy_cache storeforge_static;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- The API -----------------------------------------------------------
    # Everything under these prefixes is dynamic and tenant-scoped; caching any
    # of it at the edge would be a cross-tenant bug waiting to happen.
    location ~ ^/(shop|storefront|auth|platform|orders|products|cats|colls|pages|sections|banners|menus|menu-items|langs|trans|settings|admins|roles|customers|dashboard|media|health|ready)(/|$) {
        proxy_pass http://storeforge_api;
        proxy_cache off;
        proxy_read_timeout 30s;
    }

    # --- The storefront ----------------------------------------------------
    location / {
        proxy_pass http://storeforge_storefront;
        proxy_cache off;
        proxy_read_timeout 30s;
    }
}
