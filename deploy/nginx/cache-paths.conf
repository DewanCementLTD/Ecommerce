##
## Proxy cache zones, included from the `http` block in nginx.conf.
##
## These cannot live in `storeforge.conf`: `proxy_cache_path` is only valid at
## `http` level, and a `proxy_cache` directive that names a zone declared
## nowhere makes `nginx -t` fail — which is the failure everyone hits once when
## copying a site config between servers.
##
## Add to /etc/nginx/nginx.conf inside `http { … }`:
##     include /etc/nginx/conf.d/storeforge-cache-paths.conf;
##

proxy_cache_path /var/cache/nginx/storeforge-media
                 levels=1:2
                 keys_zone=storeforge_media:32m
                 max_size=8g
                 inactive=30d
                 use_temp_path=off;

proxy_cache_path /var/cache/nginx/storeforge-static
                 levels=1:2
                 keys_zone=storeforge_static:16m
                 max_size=2g
                 inactive=365d
                 use_temp_path=off;
